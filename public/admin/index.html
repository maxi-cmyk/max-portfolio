<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>panda.sys administration</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <!-- An easter egg (robots.txt points here). Nothing typed on this page
         leaves the browser: there is no server, and the form sends nothing. -->
    <!-- TODO(max): change the default admin / admin before launch -->
    <style>
      :root {
        --ink: #1d1d1d;
        --paper: #f4f3ed;
        --desk: #d6d5cd;
        --navy: #12376b;
        --plum: #7a2e5d;
        --muted: #545454;
        font: 15px/1.45 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        color: var(--ink);
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 16px;
        box-sizing: border-box;
        place-items: center;
        background:
          linear-gradient(rgba(18, 55, 107, 0.07) 1px, transparent 1px) 0 0 / 24px 24px,
          linear-gradient(90deg, rgba(18, 55, 107, 0.07) 1px, transparent 1px) 0 0 / 24px 24px,
          var(--desk);
      }
      .window {
        width: min(100%, 420px);
        border: 1.5px solid var(--ink);
        background: var(--paper);
        box-shadow: 3px 3px 0 var(--ink);
      }
      .bar {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 26px;
        border-bottom: 1.5px solid var(--ink);
        background: repeating-linear-gradient(0deg, var(--ink) 0 1px, var(--paper) 1px 3px);
      }
      .bar span {
        padding: 0 10px;
        background: var(--paper);
        font-size: 13px;
      }
      .body {
        padding: 22px 24px 24px;
      }
      h1 {
        margin: 0 0 4px;
        color: var(--navy);
        font-size: 20px;
      }
      .warn {
        margin: 0 0 18px;
        color: var(--plum);
        font-size: 13px;
      }
      label {
        display: block;
        margin: 12px 0 4px;
        font-size: 13px;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        min-height: 40px;
        padding: 6px 10px;
        border: 1.5px solid var(--ink);
        border-radius: 0;
        background: #fff;
        color: var(--ink);
        -webkit-appearance: none;
        appearance: none;
        font: inherit;
      }
      input:focus-visible,
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--navy);
        outline-offset: 2px;
      }
      button {
        min-height: 44px;
        margin-top: 18px;
        padding: 0 20px;
        border: 1.5px solid var(--ink);
        border-radius: 8px;
        background: var(--paper);
        box-shadow: 2px 2px 0 var(--ink);
        /* iOS paints button text in its pale system blue unless told otherwise. */
        color: var(--ink);
        -webkit-appearance: none;
        appearance: none;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:active {
        box-shadow: none;
        transform: translate(2px, 2px);
      }
      #result {
        margin: 18px 0 0;
        white-space: pre-wrap;
      }
      #result:empty {
        display: none;
      }
      .small {
        color: var(--muted);
        font-size: 12px;
      }
      a {
        color: var(--navy);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="window">
      <div class="bar"><span>panda.sys — admin</span></div>
      <div class="body">
        <h1>Administration</h1>
        <p class="warn">Authorized personnel only. All access is logged.</p>
        <form id="login" novalidate>
          <label for="user">Username</label>
          <input id="user" name="user" autocomplete="off" spellcheck="false" />
          <label for="pass">Password</label>
          <input id="pass" name="pass" type="password" autocomplete="off" />
          <button type="submit">Log in</button>
        </form>
        <p id="result" role="status" aria-live="polite"></p>
        <p class="small"><a href="/#home">‹ Back to the desktop</a></p>
      </div>
    </main>
    <script src="/admin/admin.js"></script>
  </body>
</html>
